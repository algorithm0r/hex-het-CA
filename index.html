<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hex CA</title>
    <link rel="stylesheet" type="text/css" href="./style.css">
    <script type="text/javascript" src="./assetmanager.js"></script>
    <script type="text/javascript" src="./gameengine.js"></script>
    <script type="text/javascript" src="./util.js"></script>
    <script type="text/javascript" src="./params.js"></script>
    <script type="text/javascript" src="./hexca.js"></script>
    <script type="text/javascript" src="./graph.js"></script>
    <script type="text/javascript" src="./histogram.js"></script>
    <script type="text/javascript" src="./rulespace.js"></script>
    <script type="text/javascript" src="./views.js"></script>
    <script type="text/javascript" src="./stats.js"></script>
    <script type="text/javascript" src="./main.js"></script>
</head>
<body>
    <canvas id="gameWorld" width="1800" height="1000"></canvas>
    <div id="controlPanel">
        <div id="frameRate">FPS: --</div>
        <div id="tickCount">Tick: 0</div>
        <div id="parameters">
            <label for="n">Colors (n):</label>
            <select id="n">
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>

            <label for="k">k (threshold scale):</label>
            <input type="number" id="k" value="0.1" min="0.01" max="10" step="0.01" />

            <label for="pDeath">Random death rate:</label>
            <input type="number" id="pDeath" value="0.001" min="0" max="1" step="0.0001" />

            <label for="initialDensity">Initial density:</label>
            <input type="number" id="initialDensity" value="0.2" min="0" max="1" step="0.05" />

            <label for="genomeP">Init rule floor (at n_dead=0):</label>
            <input type="number" id="genomeP" value="0.05" min="0" max="1" step="0.01" />

            <label for="mutationRate">Mutation rate (per condition):</label>
            <input type="number" id="mutationRate" value="0.01" min="0" max="1" step="0.001" />

            <label for="localAtrophyRate">Local atrophy rate (unfired, globally active):</label>
            <input type="number" id="localAtrophyRate" value="0.02" min="0" max="1" step="0.005" />

            <label for="globalAtrophyRate">Global atrophy rate (unfired, globally absent):</label>
            <input type="number" id="globalAtrophyRate" value="0.1" min="0" max="1" step="0.005" />

            <label for="positiveRate">Positive mutation rate (death conditions):</label>
            <input type="number" id="positiveRate" value="0.02" min="0" max="1" step="0.005" />

            <label for="asyncUpdate">Async update:</label>
            <input type="checkbox" id="asyncUpdate" onchange="PARAMETERS.asyncUpdate = this.checked" />

            <label for="historyRules">History-dependent rules (takes effect on reset):</label>
            <input type="checkbox" id="historyRules" onchange="PARAMETERS.historyRules = this.checked" />

            <label for="coherenceBonus">Coherence bonus (energy per matching neighbor):</label>
            <input type="number" id="coherenceBonus" value="0" min="0" max="10" step="0.5" onchange="PARAMETERS.coherenceBonus = parseFloat(this.value)" />

            <label for="updatesPerDraw">Updates per frame:</label>
            <input type="number" id="updatesPerDraw" value="50" min="1" max="100" step="1" onchange="PARAMETERS.updatesPerDraw = parseInt(this.value)" />

            <label for="reportingPeriod">Graph sample period (ticks):</label>
            <input type="number" id="reportingPeriod" value="1000" min="1" max="10000" step="1" onchange="PARAMETERS.reportingPeriod = parseInt(this.value)" />

            <label for="cellSize">Cell size (px):</label>
            <input type="number" id="cellSize" value="8" min="4" max="20" step="1" />

            <hr style="border-color:#333; margin:8px 0;" />

            <label for="statsPage">Stats page (keys 1-4):</label>
            <select id="statsPage" onchange="setStatsPage(parseInt(this.value))">
                <option value="0" selected>1 - Population</option>
                <option value="1">2 - Rule space</option>
                <option value="2">3 - Rasters</option>
                <option value="3">4 - Trajectory</option>
            </select>

            <label for="rasterOrder">Raster row order (key O):</label>
            <select id="rasterOrder" onchange="setRasterOrder(this.value)">
                <option value="ndead" selected>dead neighbours, then lexicographic</option>
                <option value="enum">enumeration order</option>
                <option value="freq">current frequency</option>
                <option value="cluster">co-variation (spectral)</option>
            </select>

            <label for="genotypeView">Genotype colouring on grid (key G):</label>
            <input type="checkbox" id="genotypeView" onchange="PARAMETERS.drawMode = this.checked ? 'genotype' : 'state'" />

            <button type="button" onclick="markReference()">Mark reference (M)</button>
            <button type="button" onclick="exportRuleSpace()">Export rule-space JSON (E)</button>

            <hr style="border-color:#333; margin:8px 0;" />

            <button type="button" onclick="reset()">Reset</button>
        </div>
    </div>
</body>
</html>
